version: "3.8"

services:
  # 1. FastAPI Streaming Drift Backend & Interactive Dashboard
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drift-monitor-backend
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_ENABLED=false # Set to true to route live stream through Redpanda
      - PYTHONPATH=/app
    volumes:
      - ./backend/app/storage:/app/backend/app/storage
    depends_on:
      - redpanda
    restart: unless-stopped

  # 2. Redpanda (Kafka-compatible high-throughput streaming broker)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: drift-monitor-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    restart: unless-stopped

  # 3. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: drift-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      - backend
    restart: unless-stopped

  # 4. Grafana Dashboards
  grafana:
    image: grafana/grafana:10.3.3
    container_name: drift-monitor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
